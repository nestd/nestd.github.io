<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>nestd</title>
  <meta name="description" content="nestd: jewelry by Karen Bottomley.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="page">
    <nav class="nav" aria-label="Main">
      <a class="brand" href="index.html">Karen Lynn Bottomley</a>
      <a href="index.html#obituary">Obituary</a>
      <a href="index.html#gallery-section">Photos</a>
      <a href="nestd.html" aria-current="page">nestd</a>
    </nav>

    <header class="brandhead">
      <div class="logo"><img src="images/nestd/logo.png" alt="nestd" width="743" height="241"></div>
      <p class="tagline">Jewelry by Karen Bottomley.</p>
    </header>

    <main>
      <section class="gallery-section" id="gallery-section" aria-label="Jewelry">
        <div class="gallery big" id="gallery"></div>
      </section>
    </main>

    <footer><a href="index.html">In memory of Karen</a></footer>
  </div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-prev" aria-label="Previous">&#8249;</button>
    <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
    <button class="lb-next" aria-label="Next">&#8250;</button>
  </div>
  <script src="js/photos-nestd.js"></script>
  <script src="js/gallery.js"></script>
